name: 03 - Core Test Execution Suite

on:
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    needs: [integrity-gate]
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout Branch Context
        uses: actions/checkout@v4

      - name: Initialize Python Version ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pytest Framework
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Execute Student Test Assertions Against Target Solution
        run: |
          pytest --cov=problems --cov-report=term-missing --cov-fail-under=100
