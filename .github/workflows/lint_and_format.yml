name: 01 - Automated Code Audit Matrix

on:
  pull_request:
    branches: [ main ]

jobs:
  audit-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bootstrap Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check 1 - Module Imports Arrangement (isort)
        run: isort --check-only .

      - name: Check 2 - Code Formatting Verification (black)
        run: black --check .

      - name: Check 3 - PEP 8 Rule Adherence (flake8)
        run: flake8 . --statistics

      - name: Check 4 - Strict Type-Hint Enforcement (mypy)
        run: mypy --disallow-untyped-defs --ignore-missing-imports problems/

      - name: Check 5 - Code Complexity Analysis (radon)
        run: |
          echo "Analyzing cyclomatic complexity (Should not exceed Grade A/B)..."
          radon cc problems/ -s -n B

      - name: Check 6 - Security & Vulnerability Scan (bandit)
        run: bandit -r problems/ -ll
