name: 01 - Code Quality & Lint Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Initialize Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bootstrap Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort

      - name: Validate Module Imports Arrangement
        run: isort --check-only .

      - name: Enforce PEP 8 Style Rules via Black
        run: black --check .

      - name: Lint Syntax Constraints
        run: flake8 . --statistics
